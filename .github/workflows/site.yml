# Publishes the project's page to GitHub Pages, at https://zypec.github.io/sudoku/.
#
# The page is site/ in this repository; the shell it is drawn with is the shared kit from
# zypec/zypec.github.io, copied in by ./gradlew site.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'build.gradle.kts'
      - '.github/workflows/site.yml'
  # Sent by zypec.github.io when the shared kit changes.
  repository_dispatch:
    types: [kit-changed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zypec/zypec.github.io
          path: kit-source
          sparse-checkout: kit

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
